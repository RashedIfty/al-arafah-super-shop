<script>
/* Ask for the shop before the JavaScript that needs it has even
   downloaded, so the page is not waiting on a round trip it could have
   started half a second earlier. main.js picks these up.

   First the shop's change stamp, a few hundred bytes. A list this tab
   already holds for the same stamp is not fetched at all; anything else
   comes through Cloudflare's cache at an address carrying the stamp, or
   straight from the database if that fails. */
(function(){
  var U = "https://fkftvudfngcmrtylevnl.supabase.co";
  var K = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrZnR2dWRmbmdjbXJ0eWxldm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTU5MzYsImV4cCI6MjEwMzMzMTkzNn0.nNmgcDiSIYDkfn4bVoR9CdsojlFxPIunIdG68PAOysI";
  var h = { apikey: K, Authorization: "Bearer " + K };
  function direct(t){
    return fetch(U + "/rest/v1/" + t + "?select=*&archived_at=is.null&order=sort",
                 { headers: h }).then(function(r){ return r.ok ? r.json() : null; })
                                .catch(function(){ return null; });
  }
  function grab(t, v){
    return fetch("/api/shop?t=" + t + (v ? "&v=" + encodeURIComponent(v) : ""))
      .then(function(r){ return r.ok ? r.json() : direct(t); })
      .catch(function(){ return direct(t); });
  }
  function kept(t, v){
    try {
      if (!sessionStorage.getItem("aa-rows:" + t)) return false;
      if (v) return sessionStorage.getItem("aa-rows-v:" + t) === v;
      var at = +sessionStorage.getItem("aa-rows-at:" + t);
      return at && Date.now() - at < 300000;
    } catch (e) { return false; }
  }
  /* The stamp through the host's cache (/api/stamp), shared by every
     visitor; straight from the database if that fails. */
  function stampFrom(p){
    return p.then(function(r){ return r.ok ? r.json() : null; })
            .then(function(j){ return j && j[0] ? j[0].at : null; });
  }
  var ver = stampFrom(fetch("/api/stamp", { cache: "no-cache" }))
    .catch(function(){ return null; })
    .then(function(v){
      return v || stampFrom(fetch(U + "/rest/v1/shop_version?select=at&id=eq.1", { headers: h }))
                    .catch(function(){ return null; });
    });
  function early(t){
    return ver.then(function(v){ return kept(t, v) ? null : grab(t, v); });
  }
  window.__preload = {
    version:    ver,
    categories: early("categories"),
    products:   early("products"),
    deals:      early("deals")
  };
})();
</script>
